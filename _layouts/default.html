<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">

    <!-- Open Graph (Facebook, LinkedIn, iMessage, Slack, Discord, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ page.image | default: '/content/img/og-image.png' | absolute_url }}">
    <meta property="og:locale" content="en_US">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | default: site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">
    <meta name="twitter:image" content="{{ page.image | default: '/content/img/og-image.png' | absolute_url }}">

    <!-- Browser chrome / message-app accent on mobile -->
    <meta name="theme-color" content="#0b1426">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/content/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/content/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/content/favicon/apple-touch-icon.png">
    <link rel="shortcut icon" href="/content/favicon/favicon.ico">
</head>
<body>
    {% include nav.html %}
    <main>
        {{ content }}
    </main>
    {% include footer.html %}
</body>
</html>
