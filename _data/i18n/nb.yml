# Norwegian Bokmål (nb) display strings. Mirrors _data/i18n/en.yml.
#
# Any key omitted here falls back to the English value at render time, so it is
# safe to leave a key out until it has been translated — but never write "" to
# mean "blank", since the Liquid `default` filter treats that as missing.

meta:
  html_lang: nb
  og_locale: nb_NO
  site_title: Wordnerd 3D
  site_description: Et ordspill fra Hållingwood A/S.

lang_names:
  en: English
  nb: Norsk

# Only artwork that actually exists in content/img/nb/ is listed here. Keys left
# out fall back to the English asset, so add each one — together with its *_alt
# text — as the file lands. Still missing: og-image.png, screenshot01-03.png.
