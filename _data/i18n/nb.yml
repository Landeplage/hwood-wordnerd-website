support:
  title: Brukerstøtte — Wordnerd 3D
  description: Brukerstøtte og ofte stilte spørsmål om Wordnerd 3D.
  heading: Brukerstøtte
  # [email] erstattes med en mailto-lenke til site.support_email.
  intro: Trenger du hjelp med Wordnerd 3D? Ta kontakt med oss på [email], så svarer vi så raskt vi kan.
  faq_heading: Ofte stilte spørsmål
  faq:
    - icon: ti-device-mobile
      q: Hvilke enheter støtter Wordnerd 3D?
      a: iOS-enheter (iPhone og iPad) med iOS 16 eller nyere. Støtte for Android er planlagt i en senere oppdatering.
    - icon: ti-restore
      q: Hvordan gjenoppretter jeg kjøpene mine?
      a: Gå til innstillingene i appen og trykk «Gjenopprett kjøp». Pass på at du er logget inn med samme konto som ble brukt til det opprinnelige kjøpet.
    - icon: ti-bug
      q: Jeg har funnet en feil — hvordan melder jeg fra?
      a: Send en feilrapport til støtteadressen over med en detaljert beskrivelse av problemet, hvordan feilen kan gjenskapes, og eventuelle skjermbilder eller opplysninger om enheten.
    - icon: ti-book
      q: Ordlisten mangler et ord!
      a: Send en e-post til støtteadressen over med ordet du mener mangler, så vurderer vi det for en senere oppdatering.
    - icon: ti-trash
      q: Hvordan sletter jeg kontoen eller dataene mine?
      a: Gå til innstillingene i appen og trykk «Slett konto». Merk at handlingen ikke kan angres, og at alle dataene dine slettes permanent.

invite:
