# English (en) display strings.
#
# Every other _data/i18n/<code>.yml mirrors this shape. Missing keys fall back
# to this file at render time, so a partial translation degrades to English
# rather than to a blank page.
#
# Caution: the Liquid `default` filter treats an empty string as missing, so
# never use "" here to mean "intentionally blank" — use a real value.

meta:
  html_lang: en
  og_locale: en_US
  site_title: Wordnerd 3D
  site_description: A word game by Hållingwood A/S.

lang_names:
  en: English
  nb: Norsk

# Locale-specific artwork. Locale-neutral art (logos, hero, favicons) is
# referenced directly in the markup and lives at /content/img/ instead.
images:
  app_store_badge: /content/img/en/app_store_badge.svg
  app_store_badge_alt: Download on the App Store
  og_image: /content/img/en/og-image.png
  screenshot01: /content/img/en/screenshot_01.png
  screenshot01_alt: Screenshot
  screenshot02: /content/img/en/screenshot_02.png
  screenshot02_alt: Screenshot
  screenshot03: /content/img/en/screenshot_03.png
  screenshot03_alt: Screenshot

